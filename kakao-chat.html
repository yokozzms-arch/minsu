<title>민수 채팅 · 카카오톡 스타일</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --kakao-bg: #b2c7d9;
    --my-bubble: #fef01b;
    --other-bubble: #ffffff;
    --text-dark: #3a3a3a;
    --time-gray: #6f8296;
    --unread-yellow: #f9d000;
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    background: #333;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .phone {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 920px;
    display: flex;
    flex-direction: column;
    background: var(--kakao-bg);
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }

  /* 헤더 */
  .chat-header {
    flex: 0 0 auto;
    height: 52px;
    background: var(--kakao-bg);
    display: flex;
    align-items: center;
    padding: 0 6px;
    color: #2b2b2b;
  }

  .header-btn {
    background: none;
    border: none;
    color: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 44px;
    cursor: pointer;
  }
  .header-btn:focus-visible { outline: 2px solid #2b2b2b; outline-offset: -4px; border-radius: 8px; }

  .header-title {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 4px;
  }

  .room-name { font-size: 18px; font-weight: 600; }

  .header-actions { display: flex; align-items: center; }

  /* 채팅 본문 */
  .chat-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .chat-body::-webkit-scrollbar { width: 0; }

  .date-divider {
    display: flex;
    justify-content: center;
    margin: 8px 0 14px;
  }
  .date-divider span {
    background: rgba(0, 0, 0, 0.12);
    color: #fff;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 12px;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 85%;
    animation: pop 0.18s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg-row { animation: none; }
  }

  .msg-row.other { align-self: flex-start; }

  .profile-pic {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 15px;
    background: #f0a500;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }

  .msg-content { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

  .sender-name { font-size: 12px; color: #4a4a4a; margin-left: 2px; }

  .bubble-line { display: flex; align-items: flex-end; gap: 5px; }

  .bubble {
    padding: 8px 11px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.4;
    color: var(--text-dark);
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
  }
  .msg-row.other .bubble { background: var(--other-bubble); border-top-left-radius: 4px; }

  .msg-time { font-size: 11px; color: var(--time-gray); white-space: nowrap; flex: 0 0 auto; }
  .msg-unread { font-size: 11px; color: var(--unread-yellow); white-space: nowrap; }

  .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.me .msg-content { align-items: flex-end; }
  .msg-row.me .bubble-line { flex-direction: row-reverse; }
  .msg-row.me .bubble { background: var(--my-bubble); border-top-right-radius: 4px; }

  /* 입력창 */
  .chat-input {
    flex: 0 0 auto;
    background: #fff;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    padding: 7px 8px;
    border-top: 1px solid #eee;
  }

  .input-btn {
    background: none;
    border: none;
    color: #7d7d7d;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .input-wrap {
    flex: 1;
    display: flex;
    align-items: flex-end;
    background: #f2f3f5;
    border-radius: 18px;
    padding: 4px 8px 4px 12px;
    min-height: 38px;
  }

  #messageInput {
    flex: 1;
    border: none;
    background: none;
    resize: none;
    font-size: 15px;
    line-height: 1.4;
    max-height: 100px;
    outline: none;
    font-family: inherit;
    padding: 7px 0;
    color: #222;
  }

  .emoji-btn {
    background: none;
    border: none;
    color: #7d7d7d;
    width: 30px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .send-btn {
    flex: 0 0 auto;
    border: none;
    background: var(--my-bubble);
    color: #3a2e00;
    font-size: 14px;
    font-weight: 600;
    padding: 0 14px;
    height: 38px;
    border-radius: 18px;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s;
  }
  .send-btn:disabled { background: #e6e6e6; color: #b0b0b0; cursor: default; }
  .send-btn:active:not(:disabled) { opacity: 0.8; }
  .send-btn:focus-visible { outline: 2px solid #3a2e00; outline-offset: 2px; }
</style>

<div class="phone">
  <header class="chat-header">
    <button class="header-btn back-btn" aria-label="뒤로가기">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"/></svg>
    </button>
    <div class="header-title"><span class="room-name">민수</span></div>
    <div class="header-actions">
      <button class="header-btn" aria-label="검색">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"/></svg>
      </button>
      <button class="header-btn" aria-label="메뉴">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
    </div>
  </header>

  <main class="chat-body" id="chatBody">
    <div class="date-divider"><span id="dateLabel">오늘</span></div>
  </main>

  <footer class="chat-input">
    <button class="input-btn plus-btn" aria-label="추가">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
    </button>
    <div class="input-wrap">
      <textarea id="messageInput" rows="1" placeholder="메시지 입력"></textarea>
      <button class="emoji-btn" aria-label="이모티콘">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-3.5-9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM12 17.5c2.03 0 3.8-1.11 4.75-2.75h-9.5A5.48 5.48 0 0 0 12 17.5z"/></svg>
      </button>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="전송">전송</button>
  </footer>
</div>

<script>
  (function () {
    "use strict";

    var chatBody = document.getElementById("chatBody");
    var input = document.getElementById("messageInput");
    var sendBtn = document.getElementById("sendBtn");
    var dateLabel = document.getElementById("dateLabel");

    // 오늘 날짜 라벨
    (function setDate() {
      var d = new Date();
      var days = ["일", "월", "화", "수", "목", "금", "토"];
      dateLabel.textContent =
        d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() +
        "일 " + days[d.getDay()] + "요일";
    })();

    function currentTime() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var ampm = h < 12 ? "오전" : "오후";
      var h12 = h % 12; if (h12 === 0) h12 = 12;
      var mm = m < 10 ? "0" + m : "" + m;
      return ampm + " " + h12 + ":" + mm;
    }

    function textEl(tag, className, text) {
      var el = document.createElement(tag);
      if (className) el.className = className;
      if (text != null) el.textContent = text;
      return el;
    }

    function addMessage(opts) {
      var row = document.createElement("div");
      row.className = "msg-row " + (opts.mine ? "me" : "other");

      if (!opts.mine) {
        var pic = textEl("div", "profile-pic", null);
        pic.textContent = opts.avatar || "🙂";
        row.appendChild(pic);
      }

      var content = textEl("div", "msg-content", null);
      if (!opts.mine && opts.name) {
        content.appendChild(textEl("div", "sender-name", opts.name));
      }

      var line = textEl("div", "bubble-line", null);
      var bubble = textEl("div", "bubble", opts.text);

      if (opts.mine && opts.unread) {
        var meta = textEl("span", "msg-unread", "1");
        line.appendChild(meta);
      }
      line.appendChild(bubble);
      line.appendChild(textEl("span", "msg-time", currentTime()));

      content.appendChild(line);
      row.appendChild(content);
      chatBody.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() { chatBody.scrollTop = chatBody.scrollHeight; }

    var autoReplies = [
      "ㅇㅇ 알겠어!", "오 좋다 👍", "지금 확인해볼게~",
      "ㅋㅋㅋㅋ 진짜?", "그래 그러자!", "잠깐만, 곧 갈게",
    ];
    var replyIndex = 0;
    function nextReply() {
      var r = autoReplies[replyIndex % autoReplies.length];
      replyIndex++;
      return r;
    }

    function send() {
      var text = input.value.trim();
      if (!text) return;
      addMessage({ text: text, mine: true, unread: true });
      input.value = "";
      autoResize();
      updateSendBtn();
      input.focus();
      setTimeout(function () {
        addMessage({ text: nextReply(), mine: false, name: "민수", avatar: "😎" });
      }, 700 + Math.floor(Math.random() * 600));
    }

    function autoResize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 100) + "px";
    }

    function updateSendBtn() {
      sendBtn.disabled = input.value.trim().length === 0;
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("input", function () { autoResize(); updateSendBtn(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    addMessage({ text: "안녕! 카카오톡 스타일 채팅이야 🎉", mine: false, name: "민수", avatar: "😎" });
    addMessage({ text: "아래에 메시지를 입력해서 보내봐!", mine: false, name: "민수", avatar: "😎" });
    updateSendBtn();
  })();
</script>
